<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brr!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/brr.css" />
    </head>
    <body>
        <header id="brr">
            <div class="brrhead">
            <img
            alt="iceType"
            src="../images/IceType.png"
            id="iceType"
            />
            <p>Brr</p>
            <img
            alt="steelType"
            src="../images/SteelType.png"
            id="steelType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="icem">Ice Shard</h2>
                    <h2 class="moveSet" id="icem">Icicle Spear</h2>
                    <h2 class="moveSet" id="normalm">Swords Dance</h2>
                    <h2 class="moveSet" id="steelm">Iron Head</h2>
                </div>
                <img
                    alt="brr"
                    src="../images/brr.png"
                    id="brrim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Slush Rush</h2>
                    <h2>Ice Scales</h2>
                </div>
            </div>
            <img alt="star4" src="../images/Stars4.png" id="star4" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> Brr was caught on Route 22 and level 4.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
