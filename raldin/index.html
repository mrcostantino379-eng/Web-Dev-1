<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Raldin!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/raldin.css" />
    </head>
    <body>
        <header id="raldin">
            <div class="raldinhead">
            <img
            alt="steelType"
            src="../images/steelType.png"
            id="steelType"
            />
            <p>Raldin</p>
            <img
            alt="dragonType"
            src="../images/dragonType.png"
            id="dragonType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="rockm">Rock Tomb</h2>
                    <h2 class="moveSet" id="dragonm">Dragon Tail</h2>
                    <h2 class="moveSet" id="steelm">Flash Cannon</h2>
                    <h2 class="moveSet" id="electricm">Thunder Wave</h2>
                </div>
                <img
                    alt="raldin"
                    src="../images/raldin.png"
                    id="raldinim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Sturdy</h2>
                    <h2>Stamina</h2>
                    <h2>Bad Company</h2>
                </div>
            </div>
            <img alt="star2" src="../images/Stars2.png" id="star2" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> Raldin was caught on Route 13 in level 49.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
