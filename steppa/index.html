<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Steppa!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/steppa.css" />
    </head>
    <body>
        <header id="steppa">
            <div class="steppahead">
            <img
            alt="grassType"
            src="../images/GrassType.png"
            id="grassType"
            />
            <p>Steppa</p>
            <img
            alt="groundType"
            src="../images/GroundType.png"
            id="groundType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="grassm">Spore</h2>
                    <h2 class="moveSet" id="ghostm">Hex</h2>
                    <h2 class="moveSet" id="groundm">Earth Power</h2>
                    <h2 class="moveSet" id="grassm">Giga Drain</h2>
                </div>
                <img
                    alt="steppa"
                    src="../images/Steppa.webp"
                    id="steppaim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Clear Body</h2>
                    <h2>Mold Breaker</h2>
                </div>
            </div>
            <img alt="star3" src="../images/Stars3.png" id="star3" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> Steppa was caught in Viridian Forest and level 4.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
