<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WOWIE</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/wowie.css" />
    </head>
    <body>
        <header id="wowie">
        <div class="wowiehead">
            <img
            alt="psychicType"
            src="../images/psychicType.png"
            id="psychicType"
            />
            <p>WOWIE</p>
            <img
            alt="psychicType"
            src="../images/psychicType.png"
            id="psychicType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="psychicm">Lumina Crash</h2>
                    <h2 class="moveSet" id="normalm">Protect</h2>
                    <h2 class="moveSet" id="fairym">Dazzling Gleam</h2>
                    <h2 class="moveSet" id="ghostm">Shadow Ball</h2>
                </div>
                <img
                    alt="wowie"
                    src="../images/wowie.png"
                    id="wowieim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Frisk</h2>
                    <h2>Speed Boost</h2>
                </div>
            </div>
            <img alt="star3" src="../images/Stars3.png" id="star3" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3>
                WOWIE was caught on Route 6 at level 18.
                </h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
