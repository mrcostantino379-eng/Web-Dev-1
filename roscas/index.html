<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brr!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/roscas.css" />
    </head>
    <body>
        <header id="roscas">
            <div class="roscashead">
            <img
            alt="ghostType"
            src="../images/ghostType.png"
            id="ghostType"
            />
            <p>Roscas</p>
            <img
            alt="fairyType"
            src="../images/fairyType.png"
            id="fairyType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="ghostm">Hex</h2>
                    <h2 class="moveSet" id="psychicm">Psychic</h2>
                    <h2 class="moveSet" id="psychicm">Trick Room</h2>
                    <h2 class="moveSet" id="firem">Mystical Fire</h2>
                </div>
                <img
                    alt="roscas"
                    src="../images/roscas.png"
                    id="roscasim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Levitate</h2>
                </div>
            </div>
            <img alt="star2" src="../images/Stars2.png" id="star2" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> Roscas was caught in Pokemon Tower at level 46.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
