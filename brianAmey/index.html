<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brian Amey!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/brianamey.css" />
    </head>
    <body>
        <header id="brianAmey">
            <div class="brianAmeyhead">
            <img
            alt="poisonType"
            src="../images/poisonType.png"
            id="poisonType"
            />
            <p>Brian Amey</p>
            <img
            alt="fairyType"
            src="../images/fairyType.png"
            id="fairyType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="firem">Will-O-Wisp</h2>
                    <h2 class="moveSet" id="normalm">Protect</h2>
                    <h2 class="moveSet" id="darkm">Thief</h2>
                    <h2 class="moveSet" id="fairym">StrangeSteam</h2>
                </div>
                <img
                    alt="brianAmey"
                    src="../images/brianAmey.png"
                    id="briamAmeyim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Levitate</h2>
                    <h2>Neutralize Gas</h2>
                    <h2>Misty Surge</h2>
                </div>
            </div>
            <img alt="star2" src="../images/Stars2.png" id="star2" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> Brian Amey was caught on Route 17 in level 48.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
