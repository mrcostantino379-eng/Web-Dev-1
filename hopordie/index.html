<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hop or Die!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/hopordie.css" />
    </head>
    <body>
        <header id="hopordie">
        <div class="hopordiehead">
            <img
            alt="normalType"
            src="../images/NormalType.png"
            id="normalType"
            />
            <p>Hop or Die</p>
            <img
            alt="normalType"
            src="../images/NormalType.png"
            id="normalType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="normalm">Return</h2>
                    <h2 class="moveSet" id="bugm">U-turn</h2>
                    <h2 class="moveSet" id="normalm">Extremespeed</h2>
                    <div class="moveSet">
                        <h2 id="normalm">Tidy Up</h2>
                        <h2 id="slashM">/</h2>
                        <h2 id="firem">Fire Punch</h2>
                    </div>
                </div>
                <img
                    alt="hopordie"
                    src="../images/hopordie.png"
                    id="hopordieim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Adaptability</h2>
                    <h2>Frisk</h2>
                </div>
            </div>
            <img alt="star3" src="../images/Stars3.png" id="star3" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3>
                Hop or Die was caught on Route 2 at level 5.
                </h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
