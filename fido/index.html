<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fido!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/fido.css" />
    </head>
    <body>
        <header id="fido">
        <div class="fidohead">
            <img
            alt="darkType"
            src="../images/DarkType.png"
            id="darkType"
            />
            <p>Fido</p>
            <img
            alt="darkType"
            src="../images/DarkType.png"
            id="darkType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="darkm">Sucker Punch</h2>
                    <h2 class="moveSet" id="darkm">Crunch</h2>
                    <div class="moveSet">
                        <h2 id="normalm">Howl</h2>
                        <h2 id="slashM">/</h2>
                        <h2 id="normalm">Roar</h2>
                    </div>
                    <div class="moveSet">
                        <h2 id="icem">Ice Fang</h2>
                        <h2 id="slashM">/</h2>
                        <h2 id="firem">Fire Fang</h2>
                        <h2 id="slashM">/</h2>
                        <h2 id="electricm">Thunder Fang</h2>
                    </div>
                </div>
                <img
                    alt="Fido"
                    src="../images/fido.png"
                    id="fidoim"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Intimidate</h2>
                    <h2>Strong Jaw</h2>
                    <h2>Moxie</h2>
                </div>
            </div>
            <img alt="star4" src="../images/Stars4.png" id="star4" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3>
                </h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
