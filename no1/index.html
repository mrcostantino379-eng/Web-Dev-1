<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NO.1!</title>
        <link rel="stylesheet" href="../styles/normalize.css" />
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/no1.css" />
    </head>
    <body>
        <header id="no1">
            <div class="no1head">
            <img
            alt="normalType"
            src="../images/NormalType.png"
            id="normalType"
            />
            <p>NO.1</p>
            <img
            alt="flyingType"
            src="../images/FlyingType.png"
            id="flyingType"
            />
            </div>
        </header>
        <main>
            <div class="mpa row">
                <div class="column moveSets">
                    <h2 class="moveSet" id="moveSetTitle">Moveset</h2>
                    <h2 class="moveSet" id="flyingm">Roost</h2>
                    <h2 class="moveSet" id="normalm">Return</h2>
                    <h2 class="moveSet" id="flyingm">Brave Bird</h2>
                    <h2 class="moveSet" id="flyingm">Tailwind</h2>
                </div>
                <img
                    alt="no1"
                    src="../images/no1.webp"
                    id="no1im"
                />
                <div class="ability column">
                    <h2 id="abilityTitle">Abilities</h2>
                    <h2>Frisk</h2>
                    <h2>Sheer Force</h2>
                    <h2>Defiant</h2>
                </div>
            </div>
            <img alt="star3" src="../images/Stars3.png" id="star3" />
        </main>
        <footer>
            <div class="bodyDes">
                <h3> NO.1 was caught on Route 7 at level 37.</h3>
        </div>
        <a id="back" href="../">GO BACK!</a>
        </footer>
    </body>
</html>
